<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Calculator</title>

    <link rel="stylesheet" href="bootstrap.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <div
      class="container min-vh-100 d-flex justify-content-center align-items-center"
    >
      <div class="calculator bg-white shadow rounded-4 p-4">
        <input
          id="display"
          class="form-control mb-3 text-end fs-3"
          type="text"
        />

        <div class="row g-2">
          <div class="col-3">
            <button class="btn btn-secondary w-100 key">7</button>
          </div>

          <div class="col-3">
            <button class="btn btn-secondary w-100 key">8</button>
          </div>

          <div class="col-3">
            <button class="btn btn-secondary w-100 key">9</button>
          </div>

          <div class="col-3">
            <button class="btn btn-warning w-100 key">+</button>
          </div>

          <div class="col-3">
            <button class="btn btn-secondary w-100 key">4</button>
          </div>

          <div class="col-3">
            <button class="btn btn-secondary w-100 key">5</button>
          </div>

          <div class="col-3">
            <button class="btn btn-secondary w-100 key">6</button>
          </div>

          <div class="col-3">
            <button class="btn btn-warning w-100 key">-</button>
          </div>

          <div class="col-3">
            <button class="btn btn-secondary w-100 key">1</button>
          </div>

          <div class="col-3">
            <button class="btn btn-secondary w-100 key">2</button>
          </div>

          <div class="col-3">
            <button class="btn btn-secondary w-100 key">3</button>
          </div>

          <div class="col-3">
            <button class="btn btn-warning w-100 key">*</button>
          </div>

          <div class="col-3">
            <button class="btn btn-secondary w-100 key">0</button>
          </div>

          <div class="col-3">
            <button class="btn btn-secondary w-100 key">.</button>
          </div>

          <div class="col-3">
            <button id="delete" class="btn btn-danger w-100">DEL</button>
          </div>

          <div class="col-3">
            <button class="btn btn-warning w-100 key">/</button>
          </div>

          <div class="col-6">
            <button class="btn btn-dark w-100">C</button>
          </div>

          <div class="col-6">
            <button class="btn btn-success w-100">=</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
